<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Oslo Norway Travel and Photography Expedition by Lukas Kraus — Nordic Architecture, Fjords, and Culture.">
  <meta name="author" content="Lukas Kraus">

  <link rel="icon" href="assets/media/favicon/favicon-32x32.png" type="image/x-icon" />
  <link rel="shortcut icon" href="assets/media/favicon/favicon-96x96.ico" type="image/x-icon" />

  <title>Oslo, Norway Travel &amp; Photo Log | Lukas Kraus</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="assets/css/main.css">
</head>

<body style="overflow-y: auto; background: #070a13; padding: 24px 16px;">

  <div class="static-page-container" id="article-app">
    <div style="text-align: center; padding: 60px 0; color: var(--cyan); font-family: var(--font-mono);">
      <i class="fas fa-spinner fa-spin" style="font-size: 32px; margin-bottom: 12px;"></i>
      <p>Loading Article Data from JSON...</p>
    </div>
  </div>

  <div class="cyber-lightbox" id="image-lightbox" onclick="closeLightbox()">
    <div class="lightbox-content" onclick="event.stopPropagation()">
      <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
      <img id="lightbox-img" src="" alt="Enlarged photo">
      <div id="lightbox-caption" class="lightbox-caption"></div>
    </div>
  </div>

  <script src="assets/js/article-renderer.js" data-article="oslo"></script>

</body>

</html>
