<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Primary SEO Meta Tags -->
  <title>Lukas Kraus | Autonomous Systems, ADAS & Robotics Portfolio</title>
  <meta name="description"
    content="Interactive gamified portfolio of Lukas Kraus — Software Engineer specializing in Autonomous Driving (ADAS), Parking Space Detection, Automated Valet Parking, Robotics, and CI/CD pipelines.">
  <meta name="keywords"
    content="Lukas Kraus, Autonomous Driving, ADAS, Robotics, RoboCup@Work, C++, Python, ROS, PCL, Docker, Jenkins, Robert Bosch, FHWS">
  <meta name="author" content="Lukas Kraus">

  <!-- Favicons -->
  <link rel="icon" href="assets/media/favicon/favicon-32x32.png" type="image/x-icon" />
  <link rel="shortcut icon" href="assets/media/favicon/favicon-96x96.ico" type="image/x-icon" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Modern Cyber Design System -->
  <link rel="stylesheet" href="assets/css/main.css">
</head>

<body>

  <!-- Game Canvas Viewport -->
  <canvas id="game-canvas"></canvas>
  <div class="scanline-overlay"></div>

  <!-- Heads-Up Display (HUD) -->
  <div class="hud-container">
    
    <!-- Top HUD Navigation -->
    <header class="hud-top-bar">
      <div class="hud-brand">
        <img src="assets/media/Lukas2.png" alt="Lukas Kraus" class="brand-avatar">
        <div class="brand-info">
          <h1>Lukas Kraus</h1>
          <p><i class="fas fa-microchip"></i> Autonomous Systems &amp; Robotics</p>
        </div>
      </div>

      <!-- Exploration Progress Meter -->
      <div class="hud-progress-meter">
        <div class="progress-header">
          <span>MISSION PROGRESS</span>
          <span id="hud-progress-text">0% Explored</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="hud-progress-fill"></div>
        </div>
      </div>

      <!-- Quick Action Controls -->
      <div class="hud-actions">
        <button id="codex-btn" class="cyber-btn" title="View Unlocked Career Dossiers">
          <i class="fas fa-folder-open"></i> Codex
        </button>

        <button id="fast-pass-btn" class="cyber-btn cyber-btn-fastpass" title="Recruiter Fast-Pass: Instantly Unlock All Dossiers">
          <i class="fas fa-bolt"></i> Recruiter Fast-Pass
        </button>

        <button id="sound-toggle-btn" class="cyber-btn" title="Toggle Procedural Audio">
          <i class="fas fa-volume-up"></i> SFX On
        </button>
      </div>
    </header>

    <!-- Bottom HUD Area -->
    <footer class="hud-bottom-bar">
      <!-- Navigation Controls Hint -->
      <div class="hud-hints">
        <span><i class="fas fa-gamepad"></i> Controls:</span> WASD / Arrow Keys to Drive &bull; Click/Tap Map for Autopilot &bull; Space for Brake
      </div>

      <!-- Minimap Radar -->
      <div class="minimap-wrapper">
        <div class="minimap-label">LIDAR RADAR</div>
        <canvas id="minimap-canvas" width="130" height="130"></canvas>
      </div>
    </footer>

    <!-- Legal & Privacy Footer Links -->
    <div class="hud-footer-links">
      <a href="privacy.html" target="_blank" rel="noopener noreferrer">Privacy Policy</a> &bull;
      <span>&copy; 2026 Lukas Kraus</span> &bull;
      <a href="legal-notice.html" target="_blank" rel="noopener noreferrer">Legal Notice</a>
    </div>

  </div>

  <!-- Mobile Touch Controls (Virtual D-Pad) -->
  <div class="touch-controls" id="touch-controls">
    <button class="dpad-btn" id="touch-up" aria-label="Forward"><i class="fas fa-chevron-up"></i></button>
    <button class="dpad-btn" id="touch-down" aria-label="Backward"><i class="fas fa-chevron-down"></i></button>
    <button class="dpad-btn" id="touch-left" aria-label="Turn Left"><i class="fas fa-chevron-left"></i></button>
    <button class="dpad-btn" id="touch-right" aria-label="Turn Right"><i class="fas fa-chevron-right"></i></button>
  </div>

  <!-- Interactive Dossier / Codex Modal Dialog -->
  <div class="cyber-modal-backdrop" id="dossier-modal">
    <div class="cyber-modal-window">
      <div class="modal-header">
        <h2 id="modal-title"><i class="fas fa-terminal"></i> Dossier</h2>
        <button class="modal-close-btn" id="modal-close-btn" aria-label="Close dialog">&times;</button>
      </div>
      <div class="modal-body" id="modal-body">
        <!-- Injected dynamically via HUDController -->
      </div>
    </div>
  </div>

  <!-- Game Bootstrap (ES6 Modules) -->
  <script type="module" src="assets/js/game/app.js"></script>

</body>

</html>
